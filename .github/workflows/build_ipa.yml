name: Build IPA - Sin firma

on:
  workflow_dispatch:

jobs:
  build-unsigned:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Crear proyecto iOS mínimo
        run: |
          mkdir -p MiApp/MiApp
          
          cat << 'EOF' > MiApp/project.yml
          name: MiApp
          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          targets:
            MiApp:
              type: application
              platform: iOS
              sources: [MiApp]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.tuapp.movies
                INFOPLIST_FILE: MiApp/Info.plist
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
          EOF

          cat << 'EOF' > MiApp/MiApp/AppDelegate.swift
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  let label = UILabel(frame: CGRect(x: 20, y: 200, width: 350, height: 100))
                  label.text = "🍿 Movies App - Funcionando"
                  label.textColor = .white
                  label.textAlignment = .center
                  label.font = UIFont.boldSystemFont(ofSize: 22)
                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          cat << 'EOF' > MiApp/MiApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>MiApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

      - name: Generar .xcodeproj
        run: cd MiApp && xcodegen generate

      - name: Verificar proyecto creado
        run: ls -la MiApp/MiApp.xcodeproj

      - name: Crear ExportOptions.plist sin firma
        run: |
          cat << 'EOF' > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>development</string>
              <key>teamID</key>
              <string></string>
              <key>compileBitcode</key>
              <false/>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>
          EOF

      - name: Compilar Archive sin firma
        run: |
          xcodebuild \
            -project MiApp/MiApp.xcodeproj \
            -scheme MiApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MiApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Exportar IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MiApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Verificar IPA generada
        run: |
          echo "=== Buscando IPA ==="
          find $RUNNER_TEMP/ipa -name "*.ipa"

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MoviesApp-sin-firma
          path: ${{ runner.temp }}/ipa/*.ipa
