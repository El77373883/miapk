name: Build IPA - Movies & Series App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar certificado
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12

          echo "Tamaño del certificado:"
          ls -la $RUNNER_TEMP/certificate.p12

          security create-keychain -p "temporal123" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "temporal123" build.keychain
          security set-keychain-settings -lut 21600 build.keychain

          security import $RUNNER_TEMP/certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "temporal123" build.keychain

          echo "=== Certificados instalados ==="
          security find-identity -v -p codesigning build.keychain

      - name: Instalar provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$PROVISIONING_PROFILE" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "=== Profiles instalados ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Listar archivos del proyecto
        run: |
          echo "=== Archivos en raíz ==="
          ls -la
          echo "=== Schemes disponibles ==="
          xcodebuild -list 2>&1 || true

      - name: Build Archive
        run: |
          xcodebuild \
            -project MoviesApp.xcodeproj \
            -scheme MoviesApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MoviesApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tee $RUNNER_TEMP/build.log
          exit ${PIPESTATUS[0]}

      - name: Mostrar log completo si falla
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat $RUNNER_TEMP/build.log | tail -100

      - name: Exportar IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MoviesApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Mostrar log si falla exportación
        if: failure()
        run: |
          echo "=== EXPORT LOG ==="
          ls -la $RUNNER_TEMP/ || true
          ls -la $RUNNER_TEMP/ipa || true

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MoviesApp.ipa
          path: ${{ runner.temp }}/ipa/*.ipa
