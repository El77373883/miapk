name: Build IPA Sin Firma

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Crear proyecto y compilar
        run: |
          mkdir -p MiApp/MiApp
          cd MiApp
          
          cat > project.yml << 'EOF'
          name: MiApp
          targets:
            MiApp:
              type: application
              platform: iOS
              sources: [MiApp]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.test.app
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
          EOF
          
          cat > MiApp/AppDelegate.swift << 'EOF'
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  window!.rootViewController = UIViewController()
                  window!.makeKeyAndVisible()
                  return true
              }
          }
          EOF
          
          cat > MiApp/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>MiApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
          </dict>
          </plist>
          EOF
          
          xcodegen generate
          xcodebuild -project MiApp.xcodeproj -scheme MiApp -sdk iphoneos -archivePath archive.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          
          APP=$(find archive.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r app.ipa Payload
          cp app.ipa $RUNNER_TEMP/

      - name: Subir IPA
        uses: actions/upload-artifact@v4
        with:
          name: MiApp
          path: ${{ runner.temp }}/app.ipa
