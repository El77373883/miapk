name: Construir IPA sin Proyecto Xcode

on:
  workflow_dispatch:

jobs:
  build-without-project:
    runs-on: macos-latest
    steps:
      - name: Instalar XcodeGen para crear el .xcodeproj mágico
        run: brew install xcodegen

      - name: Crear la estructura mínima de una App iOS
        run: |
          mkdir -p MilagroApp
          cat << 'EOF' > MilagroApp/project.yml
          name: MilagroApp
          settings:
            base:
              IPHONEOS_DEPLOYMENT_TARGET: "15.0"
          targets:
            MilagroApp:
              type: application
              platform: iOS
              sources: [MilagroApp]
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.milagro.app
                CODE_SIGN_IDENTITY: ""
                CODE_SIGNING_REQUIRED: NO
                CODE_SIGNING_ALLOWED: NO
          EOF

          # Creamos un código Swift ultra básico (una pantalla gris)
          cat << 'EOF' > MilagroApp/MilagroApp/AppDelegate.swift
          import UIKit
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .systemBlue
                  let label = UILabel(frame: CGRect(x: 20, y: 200, width: 300, height: 100))
                  label.text = "¡Lo logramos, wey!"
                  label.textColor = .white
                  label.textAlignment = .center
                  label.font = UIFont.boldSystemFont(ofSize: 24)
                  vc.view.addSubview(label)
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }
          EOF

          # Info.plist mínimo
          cat << 'EOF' > MilagroApp/MilagroApp/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>$(EXECUTABLE_NAME)</string>
              <key>CFBundleIdentifier</key>
              <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
              <key>CFBundleName</key>
              <string>MilagroApp</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>UILaunchStoryboardName</key>
              <string>LaunchScreen</string>
          </dict>
          </plist>
          EOF

      - name: Generar el .xcodeproj
        run: cd MilagroApp && xcodegen generate

      - name: Verificar que se creó el proyecto
        run: ls -la MilagroApp/MilagroApp.xcodeproj

      - name: Compilar el Archive sin firma
        run: |
          xcodebuild \
            -project MilagroApp/MilagroApp.xcodeproj \
            -scheme MilagroApp \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $RUNNER_TEMP/MilagroApp.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Crear IPA
        run: |
          APP=$(find $RUNNER_TEMP/MilagroApp.xcarchive/Products/Applications -name "*.app" -type d | head -1)
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r MilagroApp.ipa Payload
          rm -rf Payload

      - name: Subir el IPA Milagroso
        uses: actions/upload-artifact@v4
        with:
          name: MilagroApp.ipa
          path: "*.ipa"
