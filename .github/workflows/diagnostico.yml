name: Diagnóstico

on:
  workflow_dispatch:

jobs:
  diagnosticar:
    runs-on: macos-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Listar todo lo de ios
        run: |
          ls -la ios/
          ls -la ios/*.xcworkspace 2>/dev/null || echo "No hay .xcworkspace, ¿ejecutaste pod install?"
          ls -la ios/*.xcodeproj 2>/dev/null || echo "No hay .xcodeproj"
