name: Build IPA - Movies & Series App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Instalar certificado
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_P12" | base64 --decode > certificate.p12
          security create-keychain -p "" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "" build.keychain
          security import certificate.p12 -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Instalar provisioning profile
        env:
          PROVISIONING_PROFILE: ${{ secrets.PROVISIONING_PROFILE }}
        run: |
          echo "$PROVISIONING_PROFILE" | base64 --decode > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Listar archivos del proyecto
        run: |
          echo "=== Archivos en raíz ==="
          ls -la
          echo "=== Schemes disponibles ==="
          xcodebuild -list 2>&1 || true

      - name: Build Archive
        run: |
          xcodebuild \
            -project MoviesApp.xcodeproj \
            -scheme MoviesApp \
            -configuration Release \
            -archivePath $RUNNER_TEMP/MoviesApp.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            archive 2>&1 | tee $RUNNER_TEMP/build.log
          exit ${PIPESTATUS[0]}

      - name: Mostrar log completo si falla
        if: failure()
        run: |
          echo "=== BUILD LOG ==="
          cat $RUNNER_TEMP/build.log | tail -100

      - name: Exportar IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/MoviesApp.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/ipa

      - name: Mostrar log si falla exportación
        if: failure()
        run: |
          echo "=== EXPORT LOG ==="
          ls -la $RUNNER_TEMP/ || true
          ls -la $RUNNER_TEMP/ipa || true

      - name: Subir IPA como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: MoviesApp.ipa
          path: ${{ runner.temp }}/ipa/*.ipa
