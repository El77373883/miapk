name: Generar IPA para iOS
on:
  workflow_dispatch:
jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - run: cd ios && pod install
      - run: |
          WORKSPACE=$(ls ios/*.xcworkspace | head -1)
          NAME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$NAME" -configuration Release -sdk iphoneos -archivePath build/$NAME.xcarchive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO archive
          APP=$(find build/$NAME.xcarchive/Products -name "*.app" -type d | head -1)
          mkdir Payload && cp -r "$APP" Payload/ && zip -r $NAME.ipa Payload && rm -rf Payload
      - uses: actions/upload-artifact@v4
        with:
          name: app-ios
          path: "*.ipa"
